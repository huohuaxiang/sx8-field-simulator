name: import-artifact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the single-file build and the 20 s cut
        run: |
          mkdir -p media
          curl -fsSL "https://aka.doubaocdn.com/s/CMHSLIBVDM" -o sx8-field-simulator.html
          curl -fsSL "https://aka.doubaocdn.com/s/hsoqplF3TG" -o media/SX8_field_simulator_20s_1080p60.mp4
          sha256sum sx8-field-simulator.html media/SX8_field_simulator_20s_1080p60.mp4
          echo "expect 92fb77cfb5cea2340cdab5953c63babfea2c3d87b2cf4ff29bfbc4823d05a905 (html)"
      - name: Commit
        run: |
          git config user.name "sx8-ci"
          git config user.email "sx8-ci@users.noreply.github.com"
          git add -A
          git commit -m "chore: import SX-8 artifacts" || echo "nothing to commit"
          git push
